<div class="sobreposicao">
  <form
    class="modal-formulario"
    method="post"
    action="{{ acao }}"
    hx-post="{{ acao }}"
    hx-target="#modal"
    hx-swap="innerHTML"
  >
    <h2>{{ "Editar demanda" if demanda else "Nova demanda" }}</h2>

    <label>Titulo
      <input type="text" name="titulo" required value="{{ demanda.titulo if demanda else '' }}">
    </label>

    <label>Descricao
      <textarea name="descricao" rows="3">{{ demanda.descricao if demanda else '' }}</textarea>
    </label>

    <label>Solicitante
      <input type="text" name="solicitante" value="{{ demanda.solicitante if demanda else '' }}">
    </label>

    <label>Area
      <input type="text" name="area" value="{{ demanda.area if demanda else '' }}">
    </label>

    <label>Impacto
      <select name="impacto">
        <option value="">-</option>
        {% for valor in (1, 2, 3) %}
          <option value="{{ valor }}" {% if demanda and demanda.impacto == valor %}selected{% endif %}>
            {{ valor }}
          </option>
        {% endfor %}
      </select>
    </label>

    <label>Esforco
      <select name="esforco">
        <option value="">-</option>
        {% for valor in ("P", "M", "G") %}
          <option value="{{ valor }}" {% if demanda and demanda.esforco and demanda.esforco.value == valor %}selected{% endif %}>
            {{ valor }}
          </option>
        {% endfor %}
      </select>
    </label>

    <label>Prazo
      <input type="date" name="prazo" value="{{ demanda.prazo.isoformat() if demanda and demanda.prazo else '' }}">
    </label>

    <label>Repositorio
      <input type="text" name="repositorio" value="{{ demanda.repositorio if demanda else '' }}">
    </label>

    <label class="linha-checkbox">
      <input type="checkbox" name="delegavel" value="true" {% if demanda and demanda.delegavel %}checked{% endif %}>
      Delegavel
    </label>

    <div class="modal-acoes">
      <button type="button" onclick="document.getElementById('modal').innerHTML=''">Cancelar</button>
      <button type="submit">Salvar</button>
    </div>
  </form>
</div>
